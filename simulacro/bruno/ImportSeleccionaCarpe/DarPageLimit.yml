info:
  name: DarPageLimit
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/admin/documents?pager=1&limit=1"
  params:
    - name: pager
      value: "1"
      type: query
    - name: limit
      value: "1"
      type: query
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
